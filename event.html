<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Lenni</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body class="body">
    <header class="header">
      <div class="header__container">
        <a href="/" class="logo header__logo">
          <img class="header__logo-img" src="img/logo.svg" alt="logo" />
        </a>
        <nav class="nav header__nav">
          <a class="nav__link" href="#">Мероприятия</a>
          <a class="nav__link" href="#">Блог</a>
          <a class="nav__link" href="#">О нас</a>
          <a class="nav__link" href="#">Контакты</a>
        </nav>
        <div class="header__right-block">
          <a href="#" class="button button--outline header__login">Войти</a>
        </div>
      </div>
    </header>
    <main class="main">
      <article class="event">
        <form class="reserve event__reserve">
          <div class="checkbox reserve__checkbox">Чекбоксы</div>
          <div class="scheme reserve__scheme">Схема столов</div>
          <div class="order reserve__order">Оформление заказа</div>
          <div class="legend reserve__legend">Легенда</div>
        </form>
      </article>
    </main>
    <footer class="footer"></footer>
  </body>
</html>
