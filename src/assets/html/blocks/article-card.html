<article class="article-card @@class">
  <a class="article-card__link" href="@@link">
    <picture class="article-card__picture">
      <img class="article-card__img" src="@@img" alt="@@alt" />
    </picture>
  </a>
  <div class="article-card__info">
    <div class="article-card__left-info">
      <time class="article-card__date" datetime="@@datetime">@@time</time>
      <div class="article-card__text-block">
        <a class="article-card__link" href="@@link">
          <h4 class="article-card__title-card">@@title</h4>
        </a>
        <p class="article-card__description">@@description</p>
      </div>
    </div>
    <div class="article-card__actions">
      <a href="@@link" class="article-card__link">
        <svg class="article-card__arrow" width="91" height="60">
          <use xlink:href="assets/icons/symbols.svg#arrow" />
        </svg>
      </a>
    </div>
  </div>
</article>
