<article class="event-card @@class">
  <a href="/event.html" class="event-card__link">
    <picture class="event-card__picture">
      <img class="event-card__img" src="@@img" alt="@@alt" />
    </picture>
    <div class="event-card__container">
      <h4 class="event-card__title">
        @@title
      </h4>
      <p class="event-card__text">
        @@description
      </p>
      <time datetime="@@datetime" class="event-card__date"
        >@@time</time
      >
    </div>
  </a>
</article>
